name: Build arabella aosp Kernel

on:
  workflow_dispatch:
    inputs:
      include_ksu:
        description: 'Include KernelSU?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # --- CONFIGURATION (YOU MUST EDIT THESE) ---
  KERNEL_ARCH: "arm64"
  KERNEL_VERSION: "4.19"             # ⚠️ Change this to your actual kernel version (e.g., 4.14, 4.19, 5.4)
  DEFCONFIG_NAME: "vendor/arabella_defconfig" # ⚠️ Change to your actual defconfig path relative to arch/arm64/configs/
  
  # --- SUSFS CONFIGURATION ---
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"
  # SUSFS_VERSION: "v1.5.5"
  
  # --- PATCH SOURCE (JackA1ltman) ---
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"

  # --- KPROBE/BACKPORT CONFIGURATION ---
  # Adjust these versions to match your kernel (e.g., if 4.19, First=4, Second=19)
  FIRST_VERSION: "4"
  SECOND_VERSION: "19"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  
  # --- DEBUGGING ---
  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # [TRICK] Create Symlink for compatibility
    # Your actions expect the kernel to be in 'device_kernel', but here it IS the root.
    # We create a link so 'cd device_kernel' leads back to '.'
    - name: Simulate device_kernel directory
      run: |
        ln -s . device_kernel

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    - name: Set short commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Setup google clang toolchain
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
        tar -zxvf clang-r547379.tar.gz
        cd $GITHUB_WORKSPACE

    # 2. Generate Base Config (Membuat .config awal)
    - name: Generate Base Config
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        args="O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
        mkdir -p out
        # Ganti dengan defconfig target Anda
        make $args vendor/arabella_defconfig

    # 3. Inject SuSFS & KSU Configs (Logika Xiaomi Dev Method)
    - name: Inject SuSFS & KSU Configs
      if: github.event.inputs.include_ksu == 'true'
      run: |
        echo "KSU enabled: Injecting configuration..."
        # Install Driver KSU
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s builtin
        
        # Inject Configs ke out/.config secara manual
        ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -e THREAD_INFO_IN_TASK \
            -e KPM

    # [NEW] Prepare Patches for KProbe/SuSFS
    - name: Prepare /tmp/Patches
      run: |
        echo "Cloning Patch Repository..."
        git clone https://github.com/${{ env.PATCHES_SOURCE }} -b ${{ env.PATCHES_BRANCH }} temp_patches
        
        # Move the 'Patches' folder contents to /tmp/Patches
        mkdir -p /tmp/Patches
        cp -r temp_patches/Patches/* /tmp/Patches/
        
        echo "Verifying patch files..."
        ls -R /tmp/Patches
        rm -rf temp_patches

    # [NEW] Run SuSFS Patching
    - name: Patch SuSFS
      uses: ./.github/workflows/susfs

    # [NEW] Run KProbe/Backport Patching
    - name: Patch KProbe/Backport
      uses: ./.github/workflows/kprobe

    # [NEW] Upload Debug Logs if Patching Fails
    - name: Upload Patch Debug Rejects
      if: failure() || env.BUILD_DEBUGGER == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: patch-reject-files
        path: |
          *.rej
          rej_files_*.tar.gz

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-v60-${{ github.event.inputs.include_ksu }}-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-v60-${{ github.event.inputs.include_ksu }}-
          ${{ runner.os }}-ccache-v60-

    - name: Build kernel
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        if [ "${{ github.event.inputs.include_ksu }}" = "true" ]; then
          bash kernel.sh ksu
        else
          bash kernel.sh
        fi

    - name: Show ccache stats
      run: ccache -s

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LMV600${{ github.event.inputs.include_ksu == 'true' && '-KSU-SuSFS' || '-SuSFS' }}-Kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtb*
          out/arch/arm64/boot/dts/vendor/*.dtb